# ========================================
# 公共配置（所有环境共享）
# ========================================

spring.application.name=glint-server

# 默认激活 dev 环境
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========== Jackson ==========
spring.jackson.deserialization.fail-on-unknown-properties=true

# ========== JPA ==========
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Instant / TIMESTAMP 统一按 UTC 读写，避免 JPA 与 JdbcTemplate 匹配窗口错位
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========== Flyway ==========
# 数据库由开发者手动执行 db/glint_schema.sql；服务启动时永不自动修改数据库结构。
spring.flyway.enabled=false

# ========== OSS ==========
oss.endpoint=${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
oss.access-key-id=${OSS_ACCESS_KEY_ID:}
oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
oss.bucket=${OSS_BUCKET:glint-picture-dev}
oss.presign-expire-seconds=3600
# 读图 CDN 域名（uat/prod 配置；dev 不配则走 OSS 默认域名 + 预签名）
oss.custom-domain=${OSS_CUSTOM_DOMAIN:}

# ========== 消息加密 ==========
# Base64 编码的 32 字节 AES 密钥；uat/prod 必须由环境变量 MESSAGE_ENCRYPTION_KEY 注入
glint.message-encryption-key=${MESSAGE_ENCRYPTION_KEY:}

# ========== 高德（线网同步） ==========
# Web 服务 Key 仅服务端使用；地铁城市线网以高德 subway srhdata 为主同步源
glint.gaode.web-key=${GAODE_WEB_KEY:}
glint.gaode.subway-base-url=${GAODE_SUBWAY_BASE_URL:https://map.amap.com/service/subway}
glint.gaode.sync-on-startup=${GAODE_SYNC_ON_STARTUP:true}

# 线网手动同步管理密钥；请求头 X-Glint-Admin-Key；未配置时拒绝所有 /metro/sync
glint.metro.sync-admin-key=${METRO_SYNC_ADMIN_KEY:}

# ========== 短信验证码 ==========
glint.sms.aliyun.enabled=${SMS_ALIYUN_ENABLED:false}
glint.sms.aliyun.access-key=${SMS_ALIYUN_ACCESS_KEY:}
glint.sms.aliyun.secret=${SMS_ALIYUN_SECRET:}
glint.sms.aliyun.sign-name=${SMS_ALIYUN_SIGN_NAME:}
glint.sms.aliyun.template-code=${SMS_ALIYUN_TEMPLATE_CODE:}
glint.sms.whitelist-phones=${GLINT_SMS_WHITELIST_PHONES:}
glint.sms.dev-fixed-code=${GLINT_SMS_DEV_FIXED_CODE:}
glint.sms.dev-log-code=${GLINT_SMS_DEV_LOG_CODE:false}

# ========== Actuator ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=巧了后端服务

# ========== 优雅停机 ==========
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
