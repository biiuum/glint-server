# ========================================
# 生产环境配置
# ========================================

# ========== MySQL ==========
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:glint}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false
spring.datasource.username=${MYSQL_USERNAME:glint}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== Redis ==========
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=3000ms

# Lettuce 连接池（生产；小型机器默认值）
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:10}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:5}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=30000

# ========== 消息加密（必须由环境变量注入）==========
glint.message-encryption-key=${MESSAGE_ENCRYPTION_KEY:__MESSAGE_ENCRYPTION_KEY_NOT_SET__}

# ========== 日志 ==========
logging.level.com.glint.server=INFO
logging.level.org.springframework=WARN

# ========== OSS ==========
oss.bucket=${OSS_BUCKET:}
oss.custom-domain=${OSS_CUSTOM_DOMAIN:}
oss.read-use-presign=${OSS_READ_USE_PRESIGN:false}
oss.max-connections=${OSS_MAX_CONNECTIONS:50}
oss.connection-timeout=5000
oss.socket-timeout=30000
