# ========================================
# 开发环境配置
# ========================================

# ========== MySQL ==========
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:glint}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== Redis ==========
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Lettuce 连接池（开发环境）
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=30000

# ========== OSS（本地 dev；密钥可改用环境变量覆盖）==========
oss.endpoint=${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
oss.bucket=${OSS_BUCKET:glint-picture-dev}
oss.presign-expire-seconds=3600
# 本地 dev 不走系统 SOCKS/HTTP 代理，避免 Clash 未启动时 OSS 校验失败
oss.use-system-proxy=false

# ========== 消息加密（本地也必须显式注入，避免提交可预测密钥）==========
glint.message-encryption-key=${MESSAGE_ENCRYPTION_KEY:}

# 本地默认不发真短信；联调可用白名单号 + 任意 6 位验证码，或设置固定码
glint.sms.dev-fixed-code=${GLINT_SMS_DEV_FIXED_CODE:000000}
glint.sms.whitelist-phones=${GLINT_SMS_WHITELIST_PHONES:}

# ========== 日志 ==========
logging.level.com.glint.server=DEBUG
logging.level.org.springframework.web=DEBUG
